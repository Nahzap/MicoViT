[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micorizae"
version = "0.1.0"
description = "Identificación y cuantificación AMF/ERM por fases y capas visuales."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "MicorizaeVision" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<2.3",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12,<0.13",
    "tqdm>=4.66",
    "Pillow>=10.2",
    "PyQt5>=5.15",
]

[project.scripts]
micorizae = "micorizae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["micorizae*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]
